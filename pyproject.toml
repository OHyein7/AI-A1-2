[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korea-travel-planner"
version = "1.0.0"
description = "CLI travel recommendation pipeline using LLM and local-place APIs"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

